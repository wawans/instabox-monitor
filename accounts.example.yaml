# Contoh file konfigurasi seeding multi-akun InstaBox.
# Salin menjadi `accounts.yaml` (otomatis di-ignore oleh Git) dan mount ke container,
# lalu set INSTABOX_ACCOUNTS_FILE=/config/accounts.yaml.
accounts:
  - slug: prod-workspace
    name: Prod Workspace
    apiKey: ibk_replace_with_real_api_key_1
    baseUrl: https://api.instabox.sh
    readOnly: false
    enabled: true

  - slug: dev-personal
    name: Dev Personal (Read-Only)
    apiKey: ibk_replace_with_real_api_key_2
    baseUrl: https://api.instabox.sh
    readOnly: true
    enabled: true
